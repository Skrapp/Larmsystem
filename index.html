<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="imgs/favicon.ico" type="image/x-icon">
    <title>Wigell security</title>
</head>
<body>
    <header>
        <div>
            <img src="imgs/logo wigell security.png" alt="Logga för Wigell Security" class="logo-img">
        </div>
    </header>
    <main>
        <section id="logs-section">
            <button id="logs-btn">
                <i class="bi bi-file-earmark-text"></i>
                Visa logg
            </button>
            <div id="logs-container" hidden>
                <button id="close-logs-btn"><i class="bi bi-x-lg"></i></button>

                <ul id="logs-list">
                </ul>
            </div>
        </section>
        <section id="alarm-control-section">
            <div class="alarm-control-container" id="trespassing-status-container" data-status="inactive" data-alarm-type="trespassing">
                <button class="alarm-status-btn" id="trespassing-btn">
                    <i class="bi bi-unlock2"></i>
                    <span class="status-text">
                        Ej aktiverat
                    </span>
                </button>
                <button class="set-active-btn">Aktivera</button>
            </div>
            <div class="alarm-control-container" id="fire-status-container" data-status="active" data-alarm-type="fire">
                <button class="alarm-status-btn" id="fire-btn">
                    <i class="bi bi-fire bi-slash-circle"></i>
                    <span class= "status-text">
                        Aktiverat
                    </span>
                </button>
                <button class="set-active-btn">Stäng av larm</button>
            </div>
        </section>
        <section id="alarm-trigger-section">
            <h2>Aktivera larm manuellt</h2>
            <button class="alarm-trigger-btn" id="trespassing-trigger-btn" data-alarm-type="trespassing">
                <i class="bi bi-person-exclamation"></i>
                Utlös inbrottslarm
            </button>
            <button class="alarm-trigger-btn" id="fire-trigger-btn" data-alarm-type="fire">
                <i class="bi bi-fire"></i>
                Utlös brandlarm
            </button>
            <button class="alarm-trigger-btn" id="all-trigger-btn" data-alarm-type="all">
                <i class="bi bi-exclamation-circle"></i>
                Utlös alla larm
            </button>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
